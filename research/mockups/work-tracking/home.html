<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola · Home navigation</title>
<link rel="stylesheet" href="../../../src/renderer/styles/themes/tokens.css">
<link rel="stylesheet" href="../../../src/renderer/styles/themes/dark.css">
<link rel="stylesheet" href="../../../src/renderer/styles/themes/light.css">
<link rel="stylesheet" href="../../../src/renderer/components/Layout/styles.css">
<link rel="stylesheet" href="../../../src/renderer/components/Sidebar/styles.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans);color:var(--color-text-primary)}button,input,textarea,select{font:inherit}button{cursor:pointer}svg{flex-shrink:0}.app-header{align-items:center;padding-right:12px}.app-header-sidebar{padding-left:16px;font-size:12px}.app-header-content{height:100%;color:var(--color-text-tertiary);font-size:12px}.prototype-tools{display:flex;gap:12px;margin-left:auto;align-items:center}.prototype-tools a{color:var(--color-text-secondary)}.prototype-tools button{border:0;background:transparent;color:var(--color-text-secondary);font-size:12px}.sidebar-workspace strong{padding-left:8px;font-size:13px;font-weight:600}.home-navigation{overflow:hidden}.home-session-panel{padding-top:4px}.scope-selector select{flex:1;min-width:0;border:0;background:var(--color-bg-sidebar);color:var(--color-text-secondary);font-size:12px;outline-offset:2px}.home-tab[aria-selected=true]{color:var(--color-text-primary);border-bottom-color:var(--color-text-secondary)}.content-area{justify-content:center;align-items:center}.composer{width:min(720px,calc(100% - 64px))}.composer h1{font-size:26px;font-weight:500;text-align:center;margin:0 0 28px}.compose-box{border:1px solid var(--color-border-strong);border-radius:8px;background:var(--color-bg-sidebar);padding:12px}.compose-box textarea{resize:vertical;width:100%;min-height:110px;border:0;background:transparent;color:var(--color-text-primary);outline:none;padding:4px;font-size:14px}.compose-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.compose-controls select{max-width:180px;background:transparent;border:0;color:var(--color-text-secondary);font-size:12px;padding:4px}.compose-controls option{background:var(--color-bg-sidebar)}.send{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:var(--color-accent);color:var(--color-accent-text)}.send:disabled{opacity:.4;cursor:default}.hint{text-align:center;font-size:11px;color:var(--color-text-tertiary);margin-top:16px}.session-preview{padding:32px;width:100%;height:100%;font:13px/1.8 var(--font-mono)}.session-preview h1{font:500 18px var(--font-sans);margin-bottom:8px}.session-preview pre{white-space:pre-wrap;overflow-wrap:anywhere}.session-preview small{font-family:var(--font-sans);color:var(--color-text-secondary)}.group-nav-header>.nav-row-action{margin-right:4px}.session-nav-item{border:0}.scope-options{padding:0 16px 8px;display:flex;gap:12px}.scope-options button{border:0;padding:0;background:transparent;color:var(--color-text-tertiary);font-size:11px}.new-menu-trigger{color:var(--color-text-secondary)}.session-list .session-nav-item-subtitle{display:block}.session-status-indicator{display:inline-block}.sidebar-empty{font-style:normal}.home-session-panel[hidden]{display:none}@media(max-width:700px){.sidebar{width:210px;min-width:210px}.app-header-sidebar{width:266px;min-width:266px}.composer{width:calc(100% - 24px)}.composer h1{font-size:20px}.prototype-tools a{display:none}}
</style>
</head>
<body>
<div class="layout">
<header class="app-header"><div class="app-header-sidebar">Consola</div><div class="app-header-content">Home navigation · Interactive prototype<div class="prototype-tools"><a href="index.html">Work tracking exploration</a><button id="theme">Light theme</button><button id="reset">Reset</button></div></div></header>
<div class="layout-body">
<nav class="app-navigation" aria-label="Main navigation"><button class="app-navigation-item active" id="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></svg><span>Home</span></button><button class="app-navigation-item" id="inbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m3 3-2 12v6h22v-6L21 3ZM1 15h6l2 3h6l2-3h6"/></svg><span>Inbox</span><span class="app-navigation-badge">3</span></button></nav>
<aside class="sidebar" aria-label="Home sidebar"><div class="sidebar-workspace"><strong>Product engineering</strong><button class="new-menu-trigger" id="new" aria-label="New session">＋</button></div><div class="home-navigation"><div class="home-tabs" role="tablist" aria-label="Session views"><button class="home-tab" role="tab" data-tab="home" aria-selected="true">Home</button><button class="home-tab" role="tab" data-tab="all" aria-selected="false">All your sessions</button></div><div class="sidebar-scope-picker"><div class="scope-selector"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 6v12M18 8a10 10 0 0 1-10 10"/></svg><select id="scope" aria-label="Choose scope"></select></div></div><div class="scope-options"><button id="add-scope">＋ Add scope</button></div><div class="home-session-panel" id="sessions"></div></div></aside>
<main class="content-area" id="content"></main>
</div></div>
<script>
const $=selector=>document.querySelector(selector);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scopes=['web-app','payments-api'];
const groups=[{id:'payments',name:'Payment reliability'},{id:'shipping',name:'Shipping this week'},{id:'investigations',name:'Investigations'}];
const sessions=[{id:'review',name:'Address review',scope:'web-app',group:'payments',prompt:'Address rounding feedback in the payment confirmation.'},{id:'onboarding',name:'Simplify onboarding',scope:'web-app',group:'shipping',prompt:'Simplify workspace onboarding.'},{id:'implement',name:'Implement',scope:'web-app',prompt:'Implement the safe retry confirmation.'},{id:'api',name:'Retry API',scope:'payments-api',group:'payments',prompt:'Make payment retries safe in the API.'}];
let scope='web-app',tab='home',active=null,draft='',draftGroup='',folded=new Set();
function scopeOptions(){return scopes.map(name=>`<option ${name===scope?'selected':''}>${esc(name)}</option>`).join('')}
function row(session){return `<button class="session-nav-item ${active===session.id?'active':''}" data-session="${session.id}"><span class="session-status-indicator session-status-indicator--ready"></span><span class="session-nav-item-text"><span class="session-nav-item-name">${esc(session.name)}</span>${tab==='all'?`<span class="session-nav-item-subtitle">${esc(session.scope)}</span>`:''}</span></button>`}
function renderSidebar(){
 $('#scope').innerHTML=scopeOptions();
 document.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===tab)));
 const selected=sessions.filter(session=>session.scope===scope);
 $('#sessions').innerHTML=tab==='all'?`<div class="sidebar-section"><div class="sidebar-section-header"><span class="sidebar-section-title">All scopes · ${sessions.length}</span></div><nav class="session-list">${[...sessions].reverse().map(row).join('')}</nav></div>`:`<div class="sidebar-section"><div class="sidebar-section-header"><span class="sidebar-section-title">Your groups</span><button class="sidebar-section-button" id="add-group" aria-label="Add group">＋</button></div>${groups.map(group=>{const members=selected.filter(session=>session.group===group.id);return `<div class="group-nav-item"><div class="group-nav-header"><button class="group-nav-toggle" data-fold="${group.id}" aria-expanded="${!folded.has(group.id)}"><span>${folded.has(group.id)?'›':'⌄'}</span><span class="group-nav-name">${esc(group.name)}</span><span class="group-nav-count">${members.length}</span></button><button class="nav-row-action" data-new-group="${group.id}" aria-label="New session in ${esc(group.name)}">＋</button></div>${folded.has(group.id)?'':members.map(row).join('')}</div>`}).join('')}</div><div class="sidebar-section sidebar-ungrouped"><div class="sidebar-section-header"><span class="sidebar-section-title">Ungrouped</span><button class="sidebar-section-button" data-new-group="" aria-label="New ungrouped session">＋</button></div><nav class="session-list">${selected.filter(session=>!session.group).map(row).join('')}</nav>${selected.some(session=>!session.group)?'':'<p class="sidebar-empty">No ungrouped sessions in this scope.</p>'}</div>`;
}
function composer(){return `<div class="composer"><h1>What should we build in Product engineering?</h1><form class="compose-box" id="compose"><textarea id="prompt" aria-label="Message" placeholder="Describe a task, ask a question, or explore an idea…">${esc(draft)}</textarea><div class="compose-controls"><select aria-label="Choose agent"><option>Claude Code</option><option>Codex</option></select><select aria-label="Choose model"><option>Default model</option></select><select id="compose-scope" aria-label="Session scope">${scopeOptions()}</select><select id="compose-group" aria-label="Choose group"><option value="">Ungrouped</option>${groups.map(group=>`<option value="${group.id}" ${draftGroup===group.id?'selected':''}>${esc(group.name)}</option>`).join('')}</select><button class="send" aria-label="Send message" ${draft.trim()?'':'disabled'}>↑</button></div></form><p class="hint">↵ Send &nbsp; ⇧ ↵ New line · Fictional sessions; no agent runs.</p></div>`}
function render(){renderSidebar();const session=sessions.find(item=>item.id===active);$('#content').innerHTML=session?`<div class="session-preview"><h1>${esc(session.name)}</h1><small>${esc(session.scope)} · ${esc(groups.find(group=>group.id===session.group)?.name??'Ungrouped')}</small><pre>› ${esc(session.prompt)}</pre><small>Sample session preview. No agent was started.</small></div>`:composer()}
function start(group=''){active=null;draftGroup=group;render();$('#prompt').focus()}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.tab){tab=button.dataset.tab;renderSidebar()}else if(button.dataset.fold){const id=button.dataset.fold;folded.has(id)?folded.delete(id):folded.add(id);renderSidebar()}else if(button.hasAttribute('data-new-group'))start(button.dataset.newGroup);else if(button.dataset.session){active=button.dataset.session;const session=sessions.find(item=>item.id===active);scope=session.scope;folded.delete(session.group);render()}else if(button.id==='add-group'){const name=prompt('Group name');if(name?.trim()){groups.push({id:'group-'+Date.now(),name:name.trim()});render()}}});
document.addEventListener('change',event=>{if(['scope','compose-scope'].includes(event.target.id)){scope=event.target.value;render()}if(event.target.id==='compose-group')draftGroup=event.target.value});
document.addEventListener('input',event=>{if(event.target.id==='prompt'){draft=event.target.value;$('.send').disabled=!draft.trim()}});
document.addEventListener('submit',event=>{if(event.target.id!=='compose')return;event.preventDefault();if(!draft.trim())return;const session={id:'session-'+Date.now(),name:draft.trim().split('\n')[0],scope,group:draftGroup||undefined,prompt:draft.trim()};sessions.push(session);active=session.id;folded.delete(session.group);draft='';render()});
document.addEventListener('keydown',event=>{if(event.target.id==='prompt'&&event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('#compose').requestSubmit()}if((event.metaKey||event.ctrlKey)&&event.key==='n'){event.preventDefault();start()}});
$('#new').onclick=()=>start();$('#home').onclick=()=>render();$('#inbox').onclick=()=>location.href='providers.html';$('#reset').onclick=()=>location.reload();$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';$('#theme').textContent=light?'Dark theme':'Light theme'};$('#add-scope').onclick=()=>{const name=prompt('Scope name (prototype only; no folder is created)');if(name?.trim()&&!scopes.includes(name.trim())){scopes.push(name.trim());scope=name.trim();render()}};render();
</script>
</body>
</html>
