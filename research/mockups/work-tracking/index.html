r:var(--text);border:1px solid #39444b;background:#12181c;border-radius:6px;padding:9px 11px;width:100%}.toolbar input{max-width:275px;padding:7px 10px}.toolbar small{margin-left:auto}.work-list{border-top:1px solid var(--line)}.work-row{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:21px 7px;display:grid;grid-template-columns:28px minmax(0,1fr) 178px;gap:10px;text-align:left;align-items:start}.work-row:hover{background:#131b20}.work-row h3{font-size:15px;margin-bottom:5px}.work-row p{font-size:12px;color:var(--muted)}.work-row .facts{text-align:right;display:flex;align-items:flex-end;flex-direction:column;gap:7px}.work-row .glyph{font-size:21px;color:#85cde3;margin-top:0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.list-caption{padding:9px 7px;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.hint{padding:15px 17px;background:#141b20;border:1px solid #2c3a42;border-radius:7px;color:#a5b8c3;font-size:12px;margin-top:24px}.details{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;margin-top:24px}.card{border:1px solid var(--line);border-radius:8px;padding:20px;background:#101416;margin-bottom:16px}.card p{color:#b4bec6;font-size:13px;line-height:1.7;margin-top:9px}.next{border-left:3px solid var(--amber);background:#1b1914}.next .eyebrow{color:var(--amber);margin-bottom:8px}.next h2{font-size:17px}.next button{margin-top:15px}.item{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:14px 0}.item:last-child{border-bottom:0;padding-bottom:0}.provider{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;background:#242e38;border-radius:6px;color:#b9d7ee;font-size:10px;font-weight:700}.provider.slack{background:#322531;color:#ddb7d9}.provider.git{background:#282a30;color:#d0d2e1}.item h3{font-size:13px;margin-bottom:2px}.item small{display:block}.item .item-body{flex:1;min-width:0}.item .pill{margin-top:5px}.side-card{padding:18px;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}.side-card h3{margin-bottom:13px}.side-card p{font-size:12px;color:var(--muted);margin-top:8px}.side-card .keyval{display:flex;justify-content:space-between;margin:11px 0;font-size:12px;gap:12px}.timeline{border-left:1px solid #35404a;margin-left:7px;padding-left:23px}.event{position:relative;padding:0 0 25px}.event:before{content:"";position:absolute;left:-28px;top:5px;background:#647f8e;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg)}.event p{font-size:13px;margin-top:4px}.event small{font-size:11px}.signal{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px}.signal h3{font-size:15px;margin-bottom:7px}.signal p{font-size:13px;color:#b6c0c7}.signal button{font-size:12px}.signal .actions{display:flex;gap:5px;align-items:start;flex-wrap:wrap}.signal .row-open{border:0;background:transparent;padding:0;text-align:left}.signal .row-open:hover h3{color:var(--accent)}.empty{padding:45px;text-align:center;color:var(--muted)}.terminal-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:670px}.terminal{padding:30px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;line-height:1.9;min-width:0}.terminal p{margin-bottom:21px;max-width:700px}.terminal pre{white-space:pre-wrap;border-left:2px solid #36424b;padding:12px 18px;color:#a8b5bf;background:#101518}.terminal .prompt{color:#dae5ed;margin-top:26px;padding:15px;background:#191f25;border-radius:6px}.context{border-left:1px solid var(--line);padding:23px 19px;background:#111517}.context h2{margin:12px 0 17px;font-size:18px}.context p{font-size:12px;color:var(--muted)}.context button{font-size:12px}.context .item{font-family:-apple-system,BlinkMacSystemFont,sans-serif}.sources{display:grid;grid-template-columns:165px minmax(0,1fr);gap:22px;margin-top:24px}.sources .nav.active{background:#24313a}.source-row{padding:18px 0;border-bottom:1px solid var(--line)}.source-row h3{margin-bottom:6px}.source-row button{font-size:12px}.comparison-strip{margin:0 0 21px;display:flex;gap:7px;flex-wrap:wrap}.comparison-strip button{font-size:12px}.comparison-strip button.selected{background:#233f4c;border-color:#417389;color:#c5edfb}.preview{position:fixed;right:0;top:0;height:100vh;width:440px;max-width:100%;background:#11171b;border-left:1px solid #43545e;padding:28px;box-shadow:-30px 0 90px #0007;overflow:auto;z-index:3}.preview h2{font-size:23px;margin:23px 0 14px}.preview .next{margin-top:25px}.preview .full{width:100%;margin-top:18px}.scrim{position:fixed;inset:0;background:#0008;z-index:2}dialog{padding:25px;max-width:540px;width:calc(100% - 32px);border:1px solid #52616c;border-radius:12px;background:#141a1f;color:var(--text);box-shadow:0 20px 90px #000a}dialog::backdrop{background:#0009}dialog p{color:var(--muted);font-size:13px;margin:12px 0 19px}dialog label{display:block;font-size:12px;margin:14px 0 7px}dialog select{padding:9px;width:100%;background:#19242b;color:var(--text);border:1px solid #405461;border-radius:5px}.check{display:flex!important;gap:9px;align-items:center}.check input{width:auto}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#d0e5ed;color:#11242e;padding:12px 20px;border-radius:7px;font-size:13px;z-index:10;box-shadow:0 8px 40px #0008}.hidden{display:none!important}.related-list{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:#f1aaa4;font-size:12px;margin-top:7px}.aside-note{padding:12px 0;font-size:12px;color:var(--muted)}
@media(min-width:1500px){.page{padding:36px 45px}.work-row{padding:26px 8px}}
@media(max-width:1100px){.details{grid-template-columns:minmax(0,1fr) 240px;gap:18px}.shell{grid-template-columns:195px minmax(0,1fr)}.page{padding:24px}.terminal-layout{grid-template-columns:minmax(0,1fr) 265px}.terminal{padding:22px}.work-row{grid-template-columns:24px minmax(0,1fr) 130px}}
@media(max-width:820px){.research{padding:12px 16px;gap:10px}.research select{min-width:0;width:100%}.research .spacer{display:none}.note{padding:10px 16px}.shell{grid-template-columns:155px minmax(0,1fr)}.page{padding:20px 16px}.details,.terminal-layout,.sources{grid-template-columns:1fr}.details>aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}.context{border-left:0;border-top:1px solid var(--line)}.work-row{grid-template-columns:20px minmax(0,1fr)}.work-row .facts{grid-column:2;flex-direction:row;align-items:center;text-align:left}.signal{grid-template-columns:1fr;gap:12px}.source-menu{display:flex;gap:5px}.sources .nav{width:auto}.sidebar{padding:15px 6px}.session-nav{margin-left:0;padding-left:7px}.related-list{grid-template-columns:1fr}.topbar{padding:0 16px}.tabs{gap:15px;overflow:auto}.tabs button{white-space:nowrap}}

<body>
<header class="research"><div><strong>Work deserves a lasting home.</strong><small>Consola · Interactive design exploration · Fictional data · Changes reset on reload</small></div><div class="spacer"></div><label for="model" class="eyebrow">Compare navigation</label><select id="model"><option value="split">C · Inbox + Work — recommended</option><option value="hub">B · One Work hub</option><option value="inbox">A · Everything in Inbox</option><option value="tree">D · Work in the sidebar</option></select><a href="../../2026-09-10-work-tracking-information-architecture.md">Read evaluation ↗</a></header>
<div class="note" id="model-note"></div>
<div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="topbar"><span>Product engineering</span><span> / </span><span id="crumb"></span><div class="spacer"></div><button class="ghost" id="reset">Reset prototype</button></div><div class="mobile-nav hidden"><button data-go="work">Work</button><button data-go="inbox">Inbox</button><button data-go="session">Session</button></div><div id="content"></div></main></div>
<div id="preview-root"></div><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tracks=[
 {id:'payments',key:'PAY-88',title:'Make payment retries safe',next:'Address rounding feedback in PR #4131',status:'Needs you',tone:'amber',meta:'Jira · 2 PRs · Slack · 3 sessions',age:'Updated 8m ago',bucket:'active'},
 {id:'onboarding',key:'WEB-142',title:'Simplify workspace onboarding',next:'Wait for Maya to approve the revised flow',status:'Waiting on Maya',tone:'blue',meta:'Linear · 1 PR · 1 session',age:'Updated 2h ago',bucket:'waiting'},
 {id:'cache',key:'LOCAL',title:'Investigate the cache memory spike',next:'Compare the overnight heap profiles',status:'Ready to continue',tone:'green',meta:'No ticket yet · 1 note · 2 sessions',age:'Last session 3d ago',bucket:'active'},
 {id:'audit',key:'OPS-61',title:'Restore missing audit events',next:'Finished locally · ticket closed · PR merged',status:'Finished',tone:'green',meta:'Jira · 1 PR · 2 sessions',age:'Finished yesterday',bucket:'finished'}
];
const signals=[{id:'review',track:'payments',title:'Make payment retries safe',reason:'Changes requested on #4131 · Review session needs your input',meta:'PAY-88 · GitHub + Consola · 2 reasons · 8m ago',state:'attention'},{id:'onboarding',track:'onboarding',title:'Simplify workspace onboarding',reason:'Maya mentioned you in the design discussion',meta:'WEB-142 · Linear · 2h ago',state:'attention'},{id:'untracked',title:'Review the API rate-limit fix',reason:'You were asked to review PR #4202',meta:'GitHub · payments-api · Not tracked · 3h ago',state:'attention'}];
let model='split',screen='work',tab='active',detailTab='overview',selected='payments',source='Jira',query='',origin='work',addedLinks=[],suggestion='pending';
const notes={split:'Recommended · Inbox holds requests and changes. Work holds the lasting record. Every route opens the same work detail.',hub:'Alternative B · One Work destination with Attention, Active and Sources inside. Compact navigation, but attention is one view among several.',inbox:'Alternative A · The original proposal: provider feeds and Tracks all live inside Inbox. Notice that the content here is ongoing work, even when the queue is quiet.',tree:'Alternative D · Work and its sessions become the sidebar hierarchy. Immediate context, but this competes with existing Groups and Scopes as the list grows.'};
const pill=(t,c='')=>`<span class="pill ${c}">${esc(t)}</span>`;
const nav=(label,dest,icon,count='')=>`<button class="nav ${(screen===dest||(dest==='work'&&['detail','sources'].includes(screen)))?'active':''}" data-go="${dest}"><span aria-hidden="true">${icon}</span>${label}${count?`<span class="count">${count}</span>`:''}</button>`;
function go(dest){screen=dest;tab='active';query='';closePreview();render()}
function renderSidebar(){const n=signals.filter(s=>s.state==='attention').length;$('#sidebar').innerHTML=`<div class="brand"><em>⌘</em>consola</div><div class="workspace"><span class="eyebrow">Workspace</span><div>Product engineering <span class="muted">⌄</span></div></div>${model==='hub'?nav('Work', 'work','◈'):model==='inbox'?nav('Inbox','work','▣',n):nav('Inbox','inbox','▣',n)+nav('Work','work','◈')}${model==='tree'?`<div class="section-label">Active work</div><button class="nav" data-track="payments">◈ PAY-88 · Retries</button><div class="session-nav"><button data-go="session">● Address review</button><button data-go="session">✓ Implement API</button></div><button class="nav" data-track="onboarding">◈ WEB-142 · Onboarding</button><button class="nav" data-track="cache">◈ Cache investigation</button><div class="section-label">Unlinked sessions</div><button class="nav" data-go="session">Quick experiment</button>`:`<div class="section-label">Groups</div><div class="nav">⌄ Payments reliability</div><div class="session-nav"><button data-go="session"><span class="dot"></span> PAY-88 · Address review</button><button data-go="session">✓ PAY-88 · Implement API</button></div><div class="section-label">Scopes</div><div class="nav">⌄ payments-api</div><div class="session-nav"><button data-track="cache">○ Cache investigation</button></div><div class="nav">› web-app</div>`}<div class="footer-nav"><button class="nav" data-action="connections">⚙ Workspace settings</button><div style="padding:9px 10px"><small><span class="dot"></span> Local sessions available</small></div></div>`}
function render(){ $('#model-note').textContent=notes[model];renderSidebar();$('#crumb').textContent=screen==='detail'?`Work / ${tracks.find(t=>t.id===selected).key}`:screen==='session'?'PAY-88 / Address review':screen==='sources'?'Work / Sources':screen==='inbox'?'Inbox':model==='inbox'?'Inbox / Tracks':'Work';$('#content').innerHTML=screen==='detail'?detail():screen==='session'?session():screen==='inbox'?inbox():screen==='sources'?sources():work(); }
function alternativeTabs(){if(model==='inbox')return `<div class="comparison-strip"><button data-go="inbox">Needs attention</button><button data-source="GitHub">GitHub</button><button data-source="Jira">Jira</button><button data-source="Linear">Linear</button><button data-source="Slack">Slack</button><button class="selected" data-go="work">Tracks</button><button data-action="board">Sprint board</button></div>`;if(model==='hub')return `<div class="comparison-strip"><button class="${screen==='inbox'?'selected':''}" data-go="inbox">Attention · ${signals.filter(s=>s.state==='attention').length}</button><button class="${screen==='work'?'selected':''}" data-go="work">Active work</button><button data-go="sources">Sources</button></div>`;return ''}
function work(){let visible=tracks.filter(t=>tab==='active'?t.bucket!=='finished':t.bucket===tab).filter(t=>(t.title+' '+t.key+' '+t.next).toLowerCase().includes(query.toLowerCase()));return `<div class="page">${alternativeTabs()}<div class="row spread"><div><div class="eyebrow">Your commitments, across services</div><h1>${model==='inbox'?'Tracks':'Work'}</h1></div><button class="primary" data-action="new">＋ Track work</button></div><p class="lead">Pick up the thread. The ticket, conversation and code stay together.</p><div class="tabs">${['active','waiting','finished'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t[0].toUpperCase()+t.slice(1)} ${t==='active'?tracks.filter(x=>x.bucket!=='finished').length:tracks.filter(x=>x.bucket===t).length}</button>`).join('')}<button data-go="sources">Sources ↗</button></div><div class="toolbar"><input id="search" aria-label="Find tracked work" placeholder="Find tracked work…" value="${esc(query)}"><small>One row per piece of work · Recent activity</small></div><div class="work-list"><div class="list-caption">${tab==='active'?'In progress and waiting':tab}</div>${visible.map(t=>`<button class="work-row" data-preview="${t.id}"><span class="glyph">◈</span><div><h3>${esc(t.title)}</h3><p><span class="mono">${t.key}</span> <span aria-hidden="true">·</span> ${esc(t.next)}</p><div class="chips">${pill(t.status,t.tone)}<small>${esc(t.meta)}</small></div></div><div class="facts"><small>${esc(t.age)}</small><span class="muted">Open work →</span></div></button>`).join('')||'<div class="empty">No work matches this view.</div>'}</div><div class="hint">Quiet work stays here. Handling an Inbox update does not remove the work, its links, or its sessions.</div></div>`}
function header(t){return `<button class="ghost" data-back>← ${origin==='inbox'?'Inbox':'Work'}</button><div class="row spread gap wrap"><div><div class="row"><span class="eyebrow">Work / ${t.key}</span>${pill(t.status,t.tone)}</div><h1 style="margin-top:9px">${esc(t.title)}</h1></div>${t.id==='payments'?'<div class="row"><button data-action="link">＋ Link</button><button class="primary" data-action="start">Start session…</button></div>':''}</div><p class="lead">${t.id==='payments'?'Payments reliability · 2 repositories · Tracked since Sep 7':esc(t.meta)}</p><div class="tabs">${['overview','activity','links'].map(t=>`<button data-detail-tab="${t}" class="${detailTab===t?'active':''}">${t[0].toUpperCase()+t.slice(1)}${t==='links'?' · '+(selected==='payments'?7+addedLinks.length:2):''}</button>`).join('')}</div>`}
const providerItem=(p,title,desc,badge='',tone='')=>`<div class="item"><span class="provider ${p==='GH'?'git':p==='SL'?'slack':''}">${p}</span><div class="item-body"><h3>${title}</h3><small>${desc}</small>${badge?pill(badge,tone):''}</div></div>`;
function nextCard(){return `<div class="card next"><div class="eyebrow">Next step · You</div><h2>Address rounding feedback in PR #4131</h2><p>The API change is merged. The web PR still needs a rounding fix and a new check run.</p><div class="row wrap gap">${pill('1 PR merged','green')}${pill('1 PR changes requested','amber')}</div><button class="primary" data-go="session">Resume review session →</button><p><small>Suggested from GitHub review + latest session handoff · 8m ago</small></p></div>`}
function overview(){return `<div class="details"><section>${nextCard()}<div class="card"><div class="eyebrow">Outcome</div><p>Retry failed payments without charging a customer twice. Keep amounts consistent across the API and payment confirmation screen.</p><div class="row spread gap"><small>From PAY-88 · Jira · Synced 2m ago</small>${pill('In progress')}</div></div><div class="card"><div class="row spread"><h3>Latest decision</h3><small>Sep 9 · Javier</small></div><p>Use the original payment's idempotency key for every retry. Round only at the display boundary; keep minor units in the API.</p><small>Recorded after the Slack discussion · #payments</small></div><div class="card"><div class="row spread"><h3>Sessions & runs</h3><small>3 sessions</small></div>${providerItem('C','Address review','Claude · web-app · Needs your input','Resume available','amber')}<button class="ghost" data-go="session">Open session →</button>${providerItem('C','Implement API','Claude · payments-api · Completed yesterday')}${providerItem('CX','Plan retry behavior','Codex · payments-api · Completed Sep 7')}</div></section><aside><div class="side-card"><h3>Connected work</h3>${providerItem('JR','PAY-88','Definition · Jira','In progress')}${providerItem('GH','payments-api #4108','Implements · GitHub','Merged','green')}${providerItem('GH','web-app #4131','Implements · GitHub','Changes requested','amber')}${providerItem('SL','#payments · retry policy','Discussion · Slack')}<button class="ghost gap" data-detail-tab="links">All links & evidence →</button></div><div class="side-card"><h3>Freshness</h3><div class="keyval"><span>GitHub</span><span>1m ago</span></div><div class="keyval"><span>Jira</span><span>2m ago</span></div><div class="keyval"><span>Slack</span><span class="muted">Saved reference</span></div><p>Slack content is linked, not synced. Open the source to see new replies.</p></div><div class="side-card"><h3>Working across repositories</h3><p>payments-api<br>web-app</p><p>Each session keeps its own working directory.</p></div></aside></div>`}
function activity(){return `<div class="details"><div><div class="hint" style="margin:0 0 26px">The consequential events, decisions and handoffs for this work.</div><div class="timeline">${[['8m ago · Session','Review session needs input','The amount is stored in minor units. Confirm the expected display rounding before changing the formatter.'],['18m ago · GitHub / web-app #4131','Changes requested by Maya','Round at the display boundary. Please add the currency edge-case test.'],['Yesterday · Javier / decision','Keep the original idempotency key','Decision linked to the retry-policy discussion in Slack.'],['Yesterday · GitHub / payments-api #4108','API pull request merged','Web PR remains open. Deployment status is unknown.'],['Sep 7 · Consola','Work started from PAY-88','Plan session attached. Payments API selected as the first repository.']].map(e=>`<div class="event"><small>${e[0]}</small><h3>${e[1]}</h3><p class="muted">${e[2]}</p></div>`).join('')}</div></div><aside><div class="side-card"><h3>A history you can resume from</h3><p>Handling an Inbox signal acknowledges the interruption. The event and its context remain here.</p></div></aside></div>`}
function links(){return `<div class="gap"><div class="row spread"><p class="muted">What each artifact contributes, and why it is linked.</p><button data-action="link">＋ Link artifact</button></div><div class="related-list gap"><div class="card"><h3>Definition & discussion</h3>${providerItem('JR','PAY-88 · Payment retries','Defines · Attached by you · Preferred display item')}${providerItem('SL','#payments · retry policy','Discusses · Attached by you · Saved URL only')}${addedLinks.map(x=>providerItem('↗',esc(x.title),`${esc(x.role)} · Attached by you · Not synced`)).join('')}</div><div class="card"><h3>Implementation & execution</h3>${providerItem('GH','payments-api #4108','Implements · Produced by Implement API session')}${providerItem('GH','web-app #4131','Implements · Confirmed repository + worktree match')}${providerItem('C','3 sessions','Works on · Linked at launch and by you')}</div></div><div class="card next"><div class="eyebrow">${suggestion==='pending'?'Suggested relation':'Suggestion resolved'}</div>${suggestion==='pending'?`<h3>Slack thread: “September release coordination”</h3><p>Mentions PAY-88 and OPS-61. A mention may be background context; it does not establish that these are the same work.</p><div class="row gap"><button data-action="accept">Attach as reference</button><button data-action="reject">Not related</button></div>`:`<h3>${suggestion==='accepted'?'Attached as a reference':'Rejected · Will not be suggested again'}</h3><p>${suggestion==='accepted'?'Both work records retain their own identity.':'This prototype remembers the rejection until reset.'}</p>`}</div></div>`}
function detail(){const t=tracks.find(x=>x.id===selected);if(t.id!=='payments')return `<div class="page">${header(t)}<div class="details"><section><div class="card next"><div class="eyebrow">Next step</div><h2>${esc(t.next)}</h2><p>${t.id==='cache'?'No ticket is required to keep a useful work record. Attach one later without losing the investigation.':'This work stays in your list even without a new notification.'}</p></div><div class="card"><h3>Work brief</h3><p>${t.id==='cache'?'Find the cause of the overnight memory growth before selecting a fix. Last handoff: compare retained objects in the two captured heap profiles.':esc(t.title)}</p></div></section><aside><div class="side-card"><h3>Source context</h3><p>${esc(t.meta)}</p><p>${esc(t.age)}</p><small>Secondary example · Full interactions are illustrated in PAY-88.</small><button class="ghost gap" data-track="payments">Explore the full example →</button></div></aside></div></div>`;return `<div class="page">${header(t)}${detailTab==='overview'?overview():detailTab==='activity'?activity():links()}</div>`}
function inbox(){const filtered=signals.filter(s=>s.state===(tab==='active'?'attention':tab));return `<div class="page">${model==='hub'?alternativeTabs():''}<div class="eyebrow">Requests and changes</div><h1>${model==='hub'?'Attention':'Inbox'}</h1><p class="lead">Handle what needs you. The work stays in Work.</p><div class="tabs">${[['active','Needs attention'],['snoozed','Snoozed'],['handled','Handled']].map(([t,label])=>`<button data-tab="${t}" class="${tab===t?'active':''}">${label}</button>`).join('')}</div><div class="toolbar"><small>Grouped by work · Newest first · Acknowledgements are local</small></div>${filtered.map(s=>`<article class="signal"><button class="row-open" ${s.track?`data-preview="${s.track}"`:'data-action="untracked"'}><h3>${s.state==='attention'?'● ':''}${s.title}</h3><p>${s.reason}</p><div class="chips"><small>${s.meta}</small></div></button><div class="actions">${s.state==='attention'?`<button data-signal="${s.id}" data-state="snoozed">Snooze 1h</button><button data-signal="${s.id}" data-state="handled">Handled ✓</button>`:`<button data-signal="${s.id}" data-state="attention">Return to attention</button>`}</div></article>`).join('')||'<div class="empty"><h2>Nothing here right now</h2><p>Your tracked work is still available in Work.</p><button class="gap" data-go="work">Go to Work →</button></div>'}<div class="hint">“Handled” clears these updates, not the underlying work. A new review or request can bring the work back to your attention.</div></div>`}
function session(){return `<div class="topbar"><span class="dot"></span><span>Claude · Address review</span><div class="spacer"></div><button data-track="payments">◈ PAY-88 · Open work</button></div><div class="terminal-layout"><section class="terminal"><p style="color:var(--accent)">╭─ Claude · web-app<br>╰─ pay-88-safe-retries</p><p><strong>› Address the review feedback on PR #4131.</strong><br><span class="muted">Context: PAY-88, web PR, API result, retry-policy decision.</span></p><p>I checked the review and the API changes. The idempotency key is preserved correctly. The remaining feedback is in the payment confirmation formatter.</p><pre>✓ Read src/payments/formatAmount.ts<br>✓ Read the review on web-app#4131<br>✓ Confirm API #4108 stores amounts in minor units</pre><p>The current formatter rounds before currency conversion. I'll move that rounding to the display boundary and add an edge-case test.</p><p style="color:var(--amber)">One decision before I continue:</p><p>Should the confirmation screen use the same rounding rule as the invoice? The Slack decision covers where to round, but does not specify the tie-breaking rule.</p><div class="prompt">› <span class="muted">Session demonstration · terminal input is not connected</span></div><div class="row spread gap"><small>Needs your input</small><small>web-app · local</small></div></section><aside class="context"><div class="row spread"><span class="eyebrow">Work context</span><button class="ghost" data-track="payments">Expand ↗</button></div><h2>Make payment retries safe</h2>${pill('PAY-88')}${pill('Needs you','amber')}<div class="gap"><h3>Outcome</h3><p>Retry without double charging. Display the same amounts across API and web.</p></div><div class="card next gap" style="padding:14px"><div class="eyebrow">Latest decision</div><p style="margin:0">Keep the original idempotency key. Round only at the display boundary.</p><small>Javier · Sep 9 · Slack discussion</small></div><h3 class="gap">Other work on this outcome</h3>${providerItem('GH','API #4108','Merged yesterday','Complete','green')}${providerItem('GH','Web #4131','This session','Changes requested','amber')}${providerItem('SL','Retry-policy discussion','Saved reference')}<button class="gap" data-action="handoff">＋ Leave handoff note</button><div class="aside-note">The terminal stays visible while you check the work's context.</div></aside></div>`}
function sources(){return `<div class="page"><div class="eyebrow">Work / Sources</div><h1>Browse connected services</h1><p class="lead">Find an item to track or link. Browsing does not add everything to your work list.</p><button class="ghost gap" data-go="work">← Tracked work</button><div class="sources"><div class="source-menu">${['Jira','GitHub','Linear','Slack'].map(p=>`<button class="nav ${source===p?'active':''}" data-source="${p}">${p}</button>`).join('')}</div><div><div class="row spread"><h2>${source}</h2>${pill(source==='Slack'?'Saved links only':'Synced 2m ago',source==='Slack'?'':'green')}</div><p class="lead">${source==='Jira'?'Assigned to me · Product team':source==='GitHub'?'Your pull requests · Product engineering':source==='Linear'?'Assigned to me · Web team':'A discussion can be linked without importing a channel.'}</p>${source==='Slack'?`<div class="card gap"><h3>#payments · retry policy</h3><p>Saved reference on PAY-88. Live messages are not synced.</p><button class="gap" data-track="payments">Open tracked work →</button></div>`:source==='Jira'?`<div class="source-row"><div class="row spread"><div><h3>PAY-88 · Make payment retries safe</h3><small>In progress · Javier</small></div><button data-track="payments">Open tracked work →</button></div></div><div class="source-row"><div class="row spread wrap"><div><h3>PAY-102 · Explain declined payments</h3><small>To do · Javier · No sessions</small></div><button data-action="track-source">Track this work</button></div></div>`:source==='GitHub'?`<div class="source-row"><h3>web-app #4131 · Safe retry confirmation</h3><small>Changes requested · Implements PAY-88</small><button class="gap" data-track="payments">Open tracked work →</button></div>`:`<div class="source-row"><h3>WEB-142 · Simplify workspace onboarding</h3><small>In review · Waiting on Maya</small><button class="gap" data-track="onboarding">Open tracked work →</button></div>`}<div class="hint">Source views preserve each provider's vocabulary. Work brings the related items together around an outcome.</div></div></div></div>`}
function preview(id){selected=id;origin=screen==='inbox'?'inbox':'work';const t=tracks.find(x=>x.id===id);$('#preview-root').innerHTML=`<div class="scrim" data-close-preview></div><aside class="preview" role="dialog" aria-modal="true" aria-label="Work preview"><div class="row spread"><span class="eyebrow">Work preview · ${t.key}</span><button data-close-preview aria-label="Close preview">✕</button></div><h2>${esc(t.title)}</h2>${pill(t.status,t.tone)}${id==='payments'?nextCard():`<div class="card next"><div class="eyebrow">Next step</div><h3>${esc(t.next)}</h3></div>`}<h3>Connected context</h3><p class="lead">${esc(t.meta)}</p><p class="lead">${id==='payments'?'One outcome across Jira, GitHub, Slack and your sessions.':esc(t.age)}</p><button class="primary full" data-track="${id}">Open work →</button><button class="full" data-close-preview>Back to ${origin==='inbox'?'Inbox':'Work'}</button></aside>`;$('#preview-root [data-close-preview][aria-label]').focus()}
let previewTrigger=null;
function closePreview(){const wasOpen=!!$('#preview-root').innerHTML;$('#preview-root').innerHTML='';if(wasOpen&&previewTrigger?.isConnected)previewTrigger.focus()}
function notify(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function modal(title,body,action,label){$('#modal').innerHTML=`<form method="dialog"><div class="row spread"><h2>${title}</h2><button value="cancel" aria-label="Close dialog">✕</button></div>${body}<div class="dialog-actions"><button value="cancel">Cancel</button>${action?`<button type="button" class="primary" data-action="${action}">${label}</button>`:''}</div></form>`;$('#modal').showModal()}
function action(a){
 if(a==='link')modal('Link to this work',`<p>Add a ticket, PR, discussion, document, or any useful reference.</p><label for="link-url">URL</label><input id="link-url" type="url" placeholder="https://…"><label for="link-title">Label</label><input id="link-title" placeholder="e.g. Retry policy discussion"><label for="link-role">Relationship</label><select id="link-role"><option>Reference</option><option>Defines</option><option>Implements</option><option>Discusses</option><option>Evidence</option></select><p>Unknown providers are saved as references. A link never merges two work records.</p><div id="link-error" class="error" role="alert"></div>`,'save-link','Attach link');
 else if(a==='save-link'){let u;try{u=new URL($('#link-url').value);if(!['https:','http:'].includes(u.protocol))throw Error()}catch{ $('#link-error').textContent='Enter an http or https URL.';return }addedLinks.push({title:$('#link-title').value||u.hostname,role:$('#link-role').value});$('#modal').close();selected='payments';screen='detail';detailTab='links';render();notify('Reference attached locally. No provider data changed.');}
 else if(a==='start')modal('Start a session for PAY-88',`<p>Review the working location and context before continuing the work. This is a demonstration.</p><label for="repo">Repository</label><select id="repo"><option>web-app · review branch</option><option>payments-api · API branch</option></select><label for="recipe">Action</label><select id="recipe"><option>Address review</option><option>Plan next step</option></select><label class="check"><input type="checkbox" checked> PAY-88 outcome and ticket link</label><label class="check"><input type="checkbox" checked> PR links and latest review</label><label class="check"><input type="checkbox" checked> Decision and latest handoff</label><label class="check"><input type="checkbox"> Slack thread URL (saved reference)</label><p>One other session is waiting for your input. Resume it from the overview, or create a separate session deliberately.</p>`,'demo-start','Preview session');
 else if(a==='demo-start'){$('#modal').close();go('session');notify('Showing the sample session. No agent was started.');}
 else if(a==='reject'){suggestion='rejected';render();notify('Suggestion rejected; it stays suppressed until reset.');}
 else if(a==='accept'){suggestion='accepted';addedLinks.push({title:'September release coordination',role:'Reference'});render();}
 else if(a==='new')modal('Track a piece of work',`<p>Start with an outcome. A ticket is optional; you can link it later.</p><label for="work-title">What needs to be done?</label><input id="work-title" placeholder="e.g. Understand checkout failures"><label for="work-next">Next step</label><input id="work-next" placeholder="e.g. Inspect the failed checkout logs"><div id="new-error" class="error" role="alert"></div>`,'create','Create work');
 else if(a==='create'){const title=$('#work-title').value.trim();if(!title){$('#new-error').textContent='Add a title for this work.';return}tracks.push({id:'new-'+Date.now(),key:'LOCAL',title,next:$('#work-next').value.trim()||'Add context and choose a next step',status:'Ready to continue',tone:'green',meta:'Local work · No ticket yet',age:'Just created',bucket:'active'});$('#modal').close();go('work');notify('Local work created in this prototype.');}
 else if(a==='track-source'){if(!tracks.some(t=>t.key==='PAY-102'))tracks.push({id:'declines',key:'PAY-102',title:'Explain declined payments',next:'Read the ticket and plan the change',status:'Ready to plan',tone:'blue',meta:'Jira · No sessions yet',age:'Just tracked',bucket:'active'});go('work');notify('PAY-102 is now tracked.');}
 else if(a==='untracked')modal('Review the API rate-limit fix',`<p>GitHub PR #4202 is not part of a Track yet. A one-off notification does not automatically create work.</p><p>Choose to keep this review with your ongoing work.</p>`,'track-untracked','Track this review');
 else if(a==='track-untracked'){if(!tracks.some(t=>t.id==='rate-limit'))tracks.push({id:'rate-limit',key:'#4202',title:'Review the API rate-limit fix',next:'Read the diff and review the edge cases',status:'Ready to review',tone:'blue',meta:'GitHub · No sessions yet',age:'Just tracked',bucket:'active'});signals.find(s=>s.id==='untracked').track='rate-limit';$('#modal').close();go('work');}
 else if(a==='handoff')modal('Leave a handoff note',`<p>Capture a decision or next step for the next session.</p><label for="handoff">Note</label><textarea id="handoff" rows="4" placeholder="What did we learn, and what should happen next?"></textarea>`,'save-handoff','Save note');
 else if(a==='save-handoff'){const note=$('#handoff').value.trim();if(!note)return;$('#modal').close();$('.context').insertAdjacentHTML('beforeend',`<div class="card gap"><h3>Your handoff · Just now</h3><p>${esc(note)}</p></div>`);notify('Note shown in the demo context panel; resets when navigating.');}
 else if(a==='connections')modal('Workspace connections',`<p>Connection setup belongs in settings. Source browsing lives under Work.</p>${providerItem('GH','GitHub · Product engineering','Connected · Read feed available','Healthy','green')}${providerItem('JR','Jira · product.example','Connected · Read feed available','Healthy','green')}${providerItem('SL','Slack','Saved links only · No live feed')}`);
 else if(a==='board')modal('Sprint board placement',`<p>In the original proposal, this is another item view inside Inbox. In the recommended structure, a Jira sprint board belongs under Work → Sources → Jira.</p><p>A board of cross-service Tracks would instead be a saved Work view. Both can reuse the same layout components.</p>`);
}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-close-preview]');if(!b)return;if(b.dataset.go){go(b.dataset.go)}else if(b.dataset.track){if(screen!=='detail')origin=screen==='inbox'?'inbox':'work';selected=b.dataset.track;screen='detail';detailTab='overview';closePreview();render()}else if(b.dataset.preview){previewTrigger=b;preview(b.dataset.preview)}else if(b.hasAttribute('data-close-preview'))closePreview();else if(b.hasAttribute('data-back'))go(origin);else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.detailTab){detailTab=b.dataset.detailTab;render()}else if(b.dataset.source){source=b.dataset.source;screen='sources';render()}else if(b.dataset.signal){signals.find(s=>s.id===b.dataset.signal).state=b.dataset.state;render();notify(b.dataset.state==='handled'?'Updates handled. The work and its blockers remain in Work.':b.dataset.state==='snoozed'?'Snoozed in this demo. Use Snoozed to bring it back.':'Returned to attention.')}else if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview();const previewEl=$('.preview');if(e.key==='Tab'&&previewEl){const buttons=[...previewEl.querySelectorAll('button')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#model').addEventListener('change',e=>{model=e.target.value;go('work')});$('#reset').onclick=()=>location.reload();
const initial=new URLSearchParams(location.search).get('screen');if(['work','inbox','detail','session','sources'].includes(initial))screen=initial;render();
</script>
</body>
</html>
