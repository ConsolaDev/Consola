packages:
  - apps/*
  - packages/*

# Which dependencies may run their install scripts. pnpm fails an install on
# any package with a build script that is not listed here (strictDepBuilds),
# so a new one has to be decided: true runs it, false skips it.
allowBuilds:
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true

overrides:
  '@hono/node-server@>=2.0.0 <2.1.6': 2.1.8
  '@xmldom/xmldom@>=0.7.0 <0.8.15': 0.8.15
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  follow-redirects@>=1.16.0 <1.16.2: 1.16.3
  hono@<4.13.16: 4.13.18
  ip-address@<10.7.4: 10.7.6
  joi@>=18.0.0 <18.3.1: 18.3.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  minimatch@>=7.0.0 <11.0.1: 11.0.8
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  qs@>=2.2.5 <6.16.1: 6.16.1
  shell-quote@>=1.8.4 <1.11.0: 1.12.0
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  undici@<6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.2

patchedDependencies:
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch

sideEffectsCache: false
