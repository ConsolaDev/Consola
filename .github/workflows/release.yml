name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v0.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    if: github.repository == 'ConsolaDev/Consola'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release version
        run: |
          node -e 'const v = require("./apps/desktop/package.json").version; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v) || process.env.RELEASE_TAG !== `v${v}`) throw new Error("Tag must match the stable desktop package.json version (vX.Y.Z)")'
      - name: Check signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e 'for (const key of ["CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_ID", "APPLE_APP_SPECIFIC_PASSWORD", "APPLE_TEAM_ID"]) { if (!process.env[key]) throw new Error(`Missing release secret: ${key}`) }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter consola typecheck
      - run: pnpm --filter consola test
      - name: Build signed and notarized installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run package:distribution
      - name: Verify release assets and generate checksums
        working-directory: apps/desktop/release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(latest-mac.yml)
          for arch in arm64 x64; do
            for extension in dmg zip dmg.blockmap zip.blockmap; do
              assets+=("Consola-${version}-${arch}.${extension}")
            done
            grep -Fq "Consola-${version}-${arch}.zip" latest-mac.yml
          done
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing or empty release asset: $asset" >&2; exit 1; }
          done
          shasum -a 256 "${assets[@]}" > SHA256SUMS.txt
      - name: Save release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/SHA256SUMS.txt

  publish:
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ env.RELEASE_TAG }}
          path: release
      - name: Create or update draft release
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published. Create a new version instead." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Consola $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip ./*.blockmap latest-mac.yml SHA256SUMS.txt --clobber
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          echo "### [Review the desktop release draft]($release_url)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Test both macOS installers, then publish the draft to make downloads and automatic updates available.' >> "$GITHUB_STEP_SUMMARY"
