# Checks every pull request and every push to main. The release workflow runs
# the same typecheck and tests again on its tag before building installers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      # Biome is a prebuilt binary; skipping install scripts skips fetching
      # Electron and rebuilding node-pty, which linting never needs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Errors fail the check. Warnings are left for the editor, where they
      # point at the line being changed rather than at the whole backlog.
      - run: pnpm exec biome ci --diagnostic-level=error .

  test:
    # The platform Consola ships on, and the one the release workflow tests.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter consola typecheck
      # The site's demo runs the desktop renderer against a hand-written bridge,
      # and its build does not typecheck: this is what notices a bridge it lacks.
      - run: pnpm --filter @consola/website typecheck
      - run: pnpm --filter @consola/cloud-api --filter @consola/cloud-web --filter @consola/host --filter @consola/agent-ui typecheck
      # @consola/agent-ui's browser tests run in Vitest's browser mode on Playwright's Chromium.
      - run: pnpm --filter @consola/agent-ui exec playwright install chromium
      - run: pnpm --filter consola --filter @consola/factory-spec --filter @consola/cloud-api --filter @consola/cloud-web --filter @consola/host --filter @consola/agent-ui test
      # The chat's browser bundle must hold no server SDK (packages/agent-ui/AGENTS.md, "Build").
      - run: pnpm --filter @consola/agent-ui build
      - run: |
          if grep -rlE "@cursor/sdk|@anthropic-ai/claude-agent-sdk" packages/agent-ui/dist; then
            echo "A server SDK reached @consola/agent-ui's bundle." >&2
            exit 1
          fi

  vendor:
    # t3code's packages, copied into vendor/t3code (vendor/t3code/UPSTREAM.md),
    # checked with their own scripts: effect-tsgo and Vite+. On Linux, where t3
    # runs them: a few of their tests assume it (a /tmp that is not a symlink,
    # a copy of /usr/bin/printenv that still runs), and fail on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      # The copied packages need no install script; skipping them skips
      # fetching Electron and rebuilding node-pty for the desktop app.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter "./vendor/t3code/packages/*" --filter "./vendor/t3code/apps/*" typecheck
      # The lifted t3 server files (vendor/t3code/apps/server) hold their own
      # tests. The packages that re-export them (everything depending on
      # the lifted server, named t3 as upstream names it) run a slice of those
      # same tests, so they are left out here and every copied test runs once.
      - run: pnpm --filter "./vendor/t3code/packages/*" --filter "./vendor/t3code/apps/*" --filter "!...^t3" test
