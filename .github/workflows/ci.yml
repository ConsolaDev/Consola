# Checks every pull request and every push to main.
#
# A pull request runs only the checks its change can fail. The `changes` job
# asks Turborepo which packages the change affects, the changed packages and
# every package that depends on them, and each job below runs only for
# those: a change to one cloud app checks that app alone, and never starts
# the desktop's macOS jobs. `.github/scripts/ci-scope.mjs` holds the rules
# for what the package graph cannot see. A push to main, or a manual run,
# checks everything.
#
# `CI`, the last job, is the check the main branch's ruleset requires. It
# passes when every job it waits on passed or was skipped, so jobs can be
# added or skipped without touching the ruleset.
#
# The release workflow runs the desktop's typecheck and tests again on its tag
# before building installers. CodeQL runs in codeql.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      website: ${{ steps.scope.outputs.website }}
      agent-ui: ${{ steps.scope.outputs.agent-ui }}
      vendor: ${{ steps.scope.outputs.vendor }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Turborepo compares the merge commit with the base it merges into.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: scope
        run: node .github/scripts/ci-scope.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Errors fail the check. Warnings are left for the editor, where they
      # point at the line being changed rather than at the whole backlog.
      - name: Biome
        run: pnpm exec biome ci --diagnostic-level=error .
      # Builds the workspace packages first: Oxlint's type-aware rules read
      # their types from dist/, and without it every import from one is `any`.
      # Errors only, as for Biome: a rule with a backlog warns in the editor.
      - name: Oxlint
        run: pnpm run lint:oxlint --format=github --quiet
      - name: Licences
        run: node .github/scripts/check-licenses.mjs
      - name: Repository scripts' tests
        run: node --test '.github/scripts/*.test.mjs' 'tools/*.test.mjs'

  # Fails a pull request that adds or updates a dependency with a known
  # vulnerability. Licences are checked by `lint`, from the installed tree.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # The web apps bundle some of their development dependencies.
          fail-on-scopes: runtime, development

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The platform Consola ships on, and the one the release workflow tests.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: true
      # One step each: the desktop's typecheck and build both build the
      # workspace packages it loads, so they must not run side by side.
      - name: Typecheck
        run: pnpm --filter consola typecheck
      - name: Test
        run: pnpm --filter consola test
      - name: Build
        run: pnpm --filter consola build

  # Not yet one of the checks `CI` waits on: main has known failures. Once it
  # passes on main, add it to `CI`'s needs so it blocks merges.
  desktop-e2e:
    name: Desktop E2E (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: true
      - name: Build
        run: pnpm --filter consola build
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter consola exec playwright test --shard="$SHARD/2"
      - name: Save the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report-${{ matrix.shard }}
          retention-days: 7
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The site's demo runs the desktop renderer against a hand-written
      # bridge, and Vercel's build does not typecheck: this is what notices a
      # bridge it lacks.
      - name: Typecheck
        run: pnpm --filter @consola/website typecheck
      # No pull request waits on Vercel's deploy, so this is the build that
      # catches a broken site before it merges.
      - name: Build
        run: pnpm --filter @consola/website build
      - name: Install Chromium
        run: pnpm --filter @consola/website exec playwright install --with-deps chromium
      - name: Test
        run: pnpm --filter @consola/website test
      - name: Save the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-report
          retention-days: 7
          path: |
            apps/website/playwright-report
            apps/website/test-results

  # The chat view (packages/agent-ui/AGENTS.md). Its browser tests run on
  # Playwright's Chromium, and the library it builds is checked as a page
  # loads it.
  agent-ui:
    name: Agent UI
    needs: changes
    if: needs.changes.outputs.agent-ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The tests run @consola/host's replay host and import its testing
      # modules, which load the host's workspace dependencies
      # (@consola/runner-protocol, @consola/sandbox) from their built dist/.
      # This job runs each step with pnpm, not Turborepo, so nothing builds
      # them otherwise.
      - name: Build the host's dependencies
        run: pnpm exec turbo run build --filter=@consola/host^...
      - name: Typecheck
        run: pnpm --filter @consola/agent-ui typecheck
      - name: Install Chromium
        run: pnpm --filter @consola/agent-ui exec playwright install --with-deps chromium
      - name: Test
        run: pnpm --filter @consola/agent-ui test
      - name: Build
        run: pnpm --filter @consola/agent-ui build
      # The built stylesheet a page imports holds the chat's styles, every
      # rule scoped to the chat (packages/agent-ui/build/checkBuiltCss.ts).
      - name: Built stylesheet
        run: pnpm --filter @consola/agent-ui check:css
      # dist/THIRD-PARTY-NOTICES, written from the modules the build bundled:
      # every package and every third-party file of t3's copy listed with its
      # licence and its licence text, LGPL (heic-to), OFL (@betteroffice/fonts)
      # and t3code's own among them, and no unknown licence
      # (packages/agent-ui/build/bundleGuards.ts).
      - name: Third-party notices
        run: pnpm --filter @consola/agent-ui check:notices
      # The built library in a page: the chat styled, the page's document left
      # as it was.
      - name: Built library in a page
        run: pnpm --filter @consola/agent-ui test:dist
      # The chat's browser bundle must hold no server SDK
      # (packages/agent-ui/AGENTS.md, "Build"). The build itself fails on an
      # import of one (serverSdkGuard); this greps what that cannot see. grep exits 2 on a missing
      # folder, which the `if` would read as "no hit": check there is a bundle
      # to search first.
      - name: No server SDK in the bundle
        run: |
          if ! test -d packages/agent-ui/dist || test -z "$(ls -A packages/agent-ui/dist)"; then
            echo "No @consola/agent-ui bundle to check in packages/agent-ui/dist." >&2
            exit 1
          fi
          if grep -rlE "@cursor/sdk|@anthropic-ai/claude-agent-sdk" packages/agent-ui/dist; then
            echo "A server SDK reached @consola/agent-ui's bundle." >&2
            exit 1
          fi

  # t3code's packages, copied into vendor/t3code (vendor/t3code/UPSTREAM.md),
  # checked with their own scripts, effect-tsgo and Vite+, in one job rather
  # than one each. On Linux, where t3 runs them: a few of their tests assume
  # it (a /tmp that is not a symlink, a copy of /usr/bin/printenv that still
  # runs), and fail on macOS. The root scripts (package.json) hold the
  # filters, so a local run checks what CI checks.
  vendor:
    name: Vendored t3code
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm run typecheck:vendor
      # The lifted t3 server files (vendor/t3code/apps/server, named t3 as
      # upstream names it) hold their own tests. The packages that re-export
      # them run a slice of those same tests, so `test:vendor` leaves them out
      # and every copied test runs once.
      - name: Test
        run: pnpm run test:vendor

  # Every other workspace package, one job each, so a new package is checked
  # without being named here. Turborepo builds the packages a task depends on
  # first (`dependsOn: ["^build"]` in turbo.json).
  package:
    name: ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter="$PACKAGE" --env-mode=loose
      - name: Test
        run: pnpm exec turbo run test --filter="$PACKAGE" --env-mode=loose
      - name: Build
        run: pnpm exec turbo run build --filter="$PACKAGE" --env-mode=loose

  ci:
    name: CI
    if: always()
    needs: [changes, lint, dependency-review, desktop, website, agent-ui, vendor, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
