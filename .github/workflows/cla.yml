# Asks every outside contributor to sign CLA.md once, on their first pull
# request, and blocks the PR's CLA check until they do.
#
# Signatures are committed to the `cla-signatures` branch rather than main, so
# signing never adds commits to the product's history. That branch must exist.
#
# pull_request_target runs with write access on PRs from forks; that is safe
# here because this job never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ConsolaDev/Consola/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Exact logins only: a `*` entry becomes a regex, and `[bot]` would
          # then match any login containing b, o or t.
          allowlist: javier-tarazaga,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
