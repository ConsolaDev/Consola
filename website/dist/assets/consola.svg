<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Consola</title>
  <defs>
    <linearGradient id="tile" x1="180" y1="80" x2="830" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#353744"/>
      <stop offset=".48" stop-color="#1B1D26"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(300 160) rotate(55) scale(790 670)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4AEF5" stop-opacity=".17"/>
      <stop offset="1" stop-color="#A4AEF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="280" y1="80" x2="730" y2="945" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="pearl" x1="330" y1="245" x2="675" y2="786" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#F2F2FC"/>
      <stop offset=".75" stop-color="#D8DCF4"/>
      <stop offset="1" stop-color="#A6B0DE"/>
    </linearGradient>
    <linearGradient id="edge" x1="390" y1="260" x2="650" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C1C8EC"/>
      <stop offset="1" stop-color="#69759D"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="letterShadow" x="130" y="170" width="700" height="710" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <!-- A 270-degree annulus: the two diagonal terminals share a 45-degree cut. -->
    <path id="c" d="M 724 314 A 280 280 0 1 0 724 710 L 630 616 A 148 148 0 1 1 630 408 Z"/>
  </defs>
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="864" height="864" rx="194" fill="url(#tile)"/>
    <rect x="80" y="80" width="864" height="864" rx="194" fill="url(#halo)"/>
    <rect x="81" y="81" width="862" height="862" rx="193" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <g filter="url(#letterShadow)">
    <use href="#c" transform="translate(0 8)" fill="url(#edge)"/>
    <use href="#c" fill="url(#pearl)"/>
    <use href="#c" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.5"/>
  </g>
</svg>
